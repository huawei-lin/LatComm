[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "latcomm"
version = "1.0.0"
description = "Reusable context compression for latent communication between large language models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.11",
    "transformers>=5.15",
    "pydantic>=2.10",
    "safetensors>=0.5",
    "numpy",
    "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]
wandb = ["wandb"]

[tool.setuptools]
packages = ["latcomm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
